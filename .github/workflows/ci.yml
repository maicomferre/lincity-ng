# CI for the lincity-ng fork. Runs the 3-layer ctest suite (unit/sim/save)
# on every push to master and every PR targeting master, in two variants:
#   - build:      RelWithDebInfo, the fast correctness path.
#   - build-asan: Debug + ASan/UBSan + LSAN suppressions, the regression
#                 guard for UAF/leaks (must pass with detect_leaks=1).
#
# SDL3 3.2.0+ and libxml++-5.0 are not in ubuntu-24.04's apt, so the job
# runs in a debian:trixie container where they are available. See
# .devdocs/10-padrao-desenvolvimento.md section 3 for the test layers and
# .devdocs/06-diario-de-desenvolvimento.md (CI session) for rationale.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build (RelWithDebInfo)
            build-type: RelWithDebInfo
            cxxflags: ""
          - name: build-asan (Debug + ASan/UBSan)
            build-type: Debug
            cxxflags: "-fsanitize=address,undefined -fno-omit-frame-pointer"

    steps:
      - name: Install git and certificates (needed before checkout)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libxml2-dev libxml++-5.0-dev zlib1g-dev gettext \
            libxslt1-dev xsltproc libfmt-dev \
            libsdl3-dev libsdl3-image-dev libsdl3-mixer-dev libsdl3-ttf-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxxflags }}"

      - name: Build
        run: cmake --build build

      - name: Test (ctest, 3 layers)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure --timeout 600
